[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lib"
version = "0.1.0"
description = "A data-science project template."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ben Flint" },
]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# Runtime dependencies are intentionally empty at scaffold time.
# Add analysis libraries here as the project actually needs them, e.g.:
#   dependencies = ["pandas>=2.2", "numpy>=2.0", "matplotlib>=3.9"]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "xlrd>=2.0.2",
]

[project.urls]
Repository = "https://github.com/BenFlint123/uv_ruff_ds_template"

# ----------------------------------------------------------------------------
# Build backend: hatchling.
# Used only so `uv sync` installs `lib` in editable mode, which is what
# makes `import lib` work identically in VS Code, plain CLI Jupyter, scripts,
# and pytest with no sys.path tricks. No distribution/release ceremony
# beyond that (no py.typed, no curated sdist).
# ----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["lib"]

# ----------------------------------------------------------------------------
# uv dependency groups (installed via `uv sync --group <name>`)
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.3.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.2",
]

# ----------------------------------------------------------------------------
# Ruff — sole linter + formatter (replaces black, flake8, isort)
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["lib", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "data",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E203",   # whitespace before ':' (formatter handles)
    "E501",   # line too long (line-length enforces)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/**/*.py" = ["ARG", "SIM"]  # pytest fixtures + asserts

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["lib"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ----------------------------------------------------------------------------
# pytest
# Note: NO `pythonpath` key. The editable install (via `uv sync`) puts
# `lib` on sys.path. No sys.path hacks anywhere.
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=lib",
    "--cov-report=term-missing",
]

# ----------------------------------------------------------------------------
# Coverage — reported but never gated
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["lib"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
